schema_version: 1

project:
  name: petsuite
  description: |
    Multi-tenant SaaS for veterinary clinics (clients, pets, appointments,
    medical records, prescriptions, sales/inventory, cash register, billing,
    reports). Single DB with a tenant_id column; tenants reach the app at
    {slug}.petsuite.pe, superadmins at admin.petsuite.pe.
  # NOTE: this workspace is NOT a git repo. It contains TWO independent repos:
  #   petsuite-backend/  -> luiggifigueroa24-ctrl/petsuite-backend
  #   petsuite-fronted/  -> luiggifigueroa24-ctrl/petsuite-fronted  (sic: "fronted")
  # A change spanning both is two commits and two deploys.
  # See .claude/project/conventions/workspace-and-deploys.md
  repo_url: ""

stack:

  client_app:
    language: dart                # Dart >=3.0.0
    framework: flutter            # Flutter 3.x cross-platform (iOS / Android)
    package_manager: flutter-pub
    state_mgmt: riverpod          # flutter_riverpod 2.x + Feature-First
    realtime: laravel-reverb      # pusher_channels_flutter + WebSockets
    push_notifications: fcm       # firebase_messaging
    directory: petsuite-appclient # /Users/xmn/Desarrollos/PetSuite/petsuite-appclient

    # GATE REALITY (verified 2026-08-22 — Phase 3.9 pre-flight of
    # REQ-20260822-appclient-fase0bis). `flutter analyze` is Dart's combined
    # lint + static-analysis gate: it reports `error` (type errors),
    # `warning` and `info` in one pass, so lint_cmd and typecheck_cmd are the
    # same command deliberately.
    #   analyze : RUNS and is CURRENTLY RED — exit 1 with 10 warnings +
    #             69 infos, 0 errors. Baseline recorded in the cycle checkpoint.
    #   test    : RUNS and is GREEN — 51/51, exit 0.
    #   format  : SKIPPED (broken: no script wired; `dart format` never runs).
    # NOTE: there is no stack-profiles/flutter.md yet — Phase 4b agents get a
    # T1 context digest instead. See the cycle RETRO.
    lint_cmd: "cd petsuite-appclient && flutter analyze"
    test_cmd: "cd petsuite-appclient && flutter test"
    typecheck_cmd: "cd petsuite-appclient && flutter analyze"
    format_cmd: ""

  backend:
    language: php                 # PHP ^8.1 (composer.json); Docker image is php:8.2-fpm
    framework: lumen              # laravel/lumen-framework ^10.0
    package_manager: composer
    orm: eloquent                 # Lumen's Eloquent + a project TenantScope global scope

    # All backend commands run from petsuite-backend/petsuite-api/.
    #
    # GATE REALITY (verified 2026-08-01) — read
    # .claude/project/conventions/gates-and-verification.md before trusting these:
    #   lint      : SKIPPED (broken: nothing wired. .styleci.yml declares
    #               `preset: laravel` but no composer script and no CI step runs it.)
    #   typecheck : SKIPPED (broken: no static analyser installed. No psalm,
    #               no phpstan, no `declare(strict_types=1)` anywhere in app/.)
    #   format    : SKIPPED (broken: same as lint.)
    #   test      : RUNS — but ONLY INSIDE THE CONTAINER. There is no `php` on the
    #               host PATH, so the previously configured host-side command was a
    #               DEAD GATE: it returned `env: php: No such file or directory`,
    #               EXIT=127 — rule T7 (a gate that cannot fail is not a gate).
    #               Corrected 2026-08-22 (REQ-20260822-appclient-fase0bis).
    #
    #               CORRECTION to the 2026-08-01 amauta note: tests/ does NOT hold
    #               "only the stock Lumen ExampleTest". Verified 2026-08-22 —
    #               6 files, 350 LOC: ClientFeaturesE2ETest.php (78),
    #               ClientJwtAuthTest.php (115 — 9 real security tests over the
    #               client_jwt surface), ExampleTest.php (24), TestCase.php (18),
    #               Unit/ClientAppAuthServiceTest.php, Unit/ClientChatServiceTest.php,
    #               Unit/ClientMarketplaceServiceTest.php (85).
    #               BASELINE 2026-08-22: OK (22 tests, 39 assertions), EXIT=0.
    lint_cmd: ""
    test_cmd: "docker exec -w /var/www petsuite_dev_api_php vendor/bin/phpunit"
    typecheck_cmd: ""
    format_cmd: ""

  frontend:
    language: typescript          # TypeScript ~5.9, tsconfig strict: true + strictTemplates
    framework: angular            # Angular ^21.1, 100% standalone components, no NgModules
    package_manager: npm          # npm@11.6.2 (packageManager field)
    state_mgmt: signals           # dominant, but NOT exclusive — 11 BehaviorSubject +
                                  # 4 Subject instantiated across 8 files (15 subject
                                  # instances total) and there is no toSignal() bridge
                                  # anywhere (0 uses).
                                  # See .claude/project/conventions/architecture.md

    # All frontend commands run from petsuite-fronted/web/.
    #
    # GATE REALITY (verified 2026-08-01):
    #   lint      : SKIPPED (broken: no ESLint at all — no config file, no
    #               dependency, no script.)
    #   format    : SKIPPED (broken: Prettier config is inline in package.json
    #               but prettier is NOT a devDependency and there is no script.
    #               It only works via editor integration.)
    #   test      : RUNS and is CURRENTLY RED. src/app/app.spec.ts:22 asserts an
    #               <h1> containing 'Hello, web' against a template that renders
    #               only <router-outlet />. Fix or delete that stale CLI
    #               boilerplate spec before using `npm test` as a gate.
    #   typecheck : `npm run build` is the ONLY working static gate in the whole
    #               workspace. It is a full-graph check (strictTemplates: true),
    #               so it catches template type errors that tsc --noEmit misses.
    lint_cmd: ""
    test_cmd: "cd petsuite-fronted/web && npm test"
    typecheck_cmd: "cd petsuite-fronted/web && npm run build"
    format_cmd: ""

  database:
    # <TODO: confirm with team> — the code only proves the *driver*:
    # .env.example sets DB_CONNECTION=mysql and the Dockerfile installs pdo_mysql.
    # The workspace CLAUDE.md documents MariaDB, and production runs on AWS RDS
    # (deploy-backend.yml references petsuite-api/storage/rds-ca.pem).
    # MariaDB and MySQL are indistinguishable from the driver alone.
    engine: mariadb
    migration_tool: artisan-migrations
    # Policy since 2026-08-05 (REQ-20260805-deploy-migraciones): deploy-backend.yml
    # runs `php artisan migrate --force` on every push to main (effective once
    # feat/deploy-migrate merges). Baseline = prod schema, tracked by Laravel's
    # native `migrations` table (populated in petsuite_backup.sql). Review of
    # migrations happens in the PR, not at deploy time.

architecture:

  # Backend layering, outermost to innermost, as the codebase INTENDS it.
  # `validator` and `transformer` are cross-cutting adjuncts to `controller`,
  # not ordered layers — see .claude/project/conventions/architecture.md.
  #
  # HONESTY NOTE: this ordering is aspirational for roughly half the backend.
  # 23/43 controllers issue raw DB::table() queries and skip `service`
  # entirely. Enforce these layers for NEW and MODIFIED code; do not
  # retro-flag untouched legacy controllers.
  layers:
    - controller
    - service
    - model

  paths:
    backend_root: petsuite-backend/petsuite-api/
    frontend_root: petsuite-fronted/web/
    # Backend PHPUnit tests. The frontend colocates *.spec.ts next to sources
    # (2 files total), and tests/kuraka/ at the workspace root is the Kuraka
    # harness, not application tests.
    tests_root: petsuite-backend/petsuite-api/tests/
    migrations_root: petsuite-backend/petsuite-api/database/migrations/
    docs_process_root: docs/process/

conventions:

  # Identifiers are English (HIGH, 24/24 backend + 24/24 frontend files sampled).
  # Comments and user-facing strings are SPANISH. These are three separate
  # rules — see .claude/project/conventions/naming.md.
  naming_language: english

  # Frontend value (TypeScript strict). The PHP counterpart is `?T` for
  # nullable params/returns — documented in conventions/naming.md.
  null_syntax: "T | null"

  multi_tenant: true
  tenant_column_name: tenant_id

  # States live in final const-holder classes, not native PHP enums:
  # App\Support\{AppointmentStatus,UserRole,Plans,Permissions}. The frontend
  # mirrors them as union types + config maps. Magic strings are a finding.
  enums_for_states: true

  # <TODO: confirm with team> — these are the Kuraka defaults, NOT a detected
  # convention. The codebase blows past them today:
  #   backend  : 8 files > 700 LOC (AuthController 1285, MedicalRecordController
  #              1278, PaymentController 1086, ReceiptPdfService 952,
  #              routes/api.php 939, SuperAdminTenantController 907,
  #              AppointmentController 859, NubeFactService 568)
  #   frontend : superadmin-tenants.page.ts 897, calendar.page.ts 861,
  #              sales.page.ts 687, register-wizard.page.css 932
  # Decide whether these are (a) targets that grandfather existing files, or
  # (b) hard limits that make touching those files a refactor.
  max_file_loc: 700
  max_function_loc: 50
  max_frontend_file_loc: 400

workflow:
  # There is effectively no automated safety net (see gates above), so the
  # human gate IS the gate.
  default_mode: normal
  gates_require_user_approval: true

  # FALSE deliberately. Two reasons:
  #   1. Backend and frontend are separate repos with separate deploys, and the
  #      RBAC/plan matrix must be edited in FOUR places across both
  #      (Permissions::MODULES, Plans::MODULE_MIN_PLAN, permissions.config.ts,
  #      plan-access.config.ts). Parallel work drifts the contract.
  #   2. Zero meaningful test coverage on either side means contract drift is
  #      caught by a human or not at all. Backend first, then frontend.
  parallel_implementation: false
